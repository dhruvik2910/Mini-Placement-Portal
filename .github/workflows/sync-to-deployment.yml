name: Sync to Deployment Repository

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify deployment repository access
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::SYNC_TOKEN secret is not available to this workflow."
            exit 1
          fi

          git ls-remote "https://vagelavibhu2007:${SYNC_TOKEN}@github.com/vagelavibhu2007/mini-placement-portal.git" HEAD > /dev/null

      - name: Sync to deployment repository
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add deployment "https://vagelavibhu2007:${SYNC_TOKEN}@github.com/vagelavibhu2007/mini-placement-portal.git"

          git push deployment HEAD:main --force
